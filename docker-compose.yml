docker-compose.yml
services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ferma_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  postgres:
    image: postgres:16-alpine
    container_name: ferma_postgres
    environment:
      POSTGRES_DB: ferma_piscicola
      POSTGRES_USER: $postgres_user
      POSTGRES_PASSWORD: $postgres_password
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema_baza_date.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro

  backend:
    build: ./backend
    container_name: ferma_backend
    depends_on:
      - mosquitto
      - postgres
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: "1883"
      DB_HOST: $postgresdb
      DB_PORT: "5432"
      DB_NAME: ferma_piscicola
      DB_USER: $postgres_user
      DB_PASSWORD: $postgres_password
